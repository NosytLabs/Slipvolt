name: Recover verified upload prefix
on:
  push:
    branches: [release/oma-compute-audit]
    paths: [.github/workflows/recover-source-v2.yml]
permissions:
  contents: write
jobs:
  recover:
    if: github.repository == 'NosytLabs/Slipvolt' && github.ref == 'refs/heads/release/oma-compute-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and recover complete source records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import ast,base64,hashlib,json,lzma,os,pathlib,re,urllib.request
          root=pathlib.Path.cwd()
          spec=pathlib.Path('.github/workflows/recover-source.yml').read_text()
          manifest=spec.split("manifest = '''",1)[1].split("'''",1)[0]
          expected={line.strip().split(' ',1)[1]:line.strip().split(' ',1)[0] for line in manifest.splitlines()}
          parts=ast.literal_eval(re.search(r'parts = (\[.*\])',spec).group(1))
          def sha(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          dec=lzma.LZMADecompressor();output=[];stopped=None
          for part in parts:
              assert re.fullmatch('[0-9a-f]{40}',part)
              req=urllib.request.Request('https://api.github.com/repos/NosytLabs/Slipvolt/git/blobs/'+part,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response:data=json.load(response)
              raw=base64.b64decode(data['content']);assert sha(raw)==part
              for i in range(0,len(raw),256):
                  try:output.append(dec.decompress(raw[i:i+256],max_length=2_000_000))
                  except (lzma.LZMAError,EOFError):stopped=part;break
              if stopped:break
          text=b''.join(output).decode('utf-8',errors='ignore');assert text.startswith('{')
          pos=1;decoder=json.JSONDecoder();imported=[];mismatched=[]
          while pos<len(text):
              if text[pos:pos+1]=='}':break
              try:
                  name,end=decoder.raw_decode(text,pos);assert text[end]==':'
                  value,end=decoder.raw_decode(text,end+1)
              except (ValueError,IndexError):break
              pos=end+1
              if name not in expected:continue
              raw=value['content'].encode()
              if sha(raw)!=expected[name]:mismatched.append(name);continue
              if name.startswith('.github/'):continue
              dest=root/name;assert dest.resolve().is_relative_to(root)
              dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(raw)
              dest.chmod(0o755 if value.get('executable') else 0o644);imported.append(name)
          report={'imported':imported,'mismatched':mismatched,'missing':[n for n in expected if n not in imported],'complete_source':False,'verified_prefix_bytes':len(text),'stopped_at':stopped}
          pathlib.Path('RECOVERY_REPORT.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Commit verified recovery to staging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'build: recover independently hash-verified source records'
          git push origin HEAD:release/oma-compute-audit
