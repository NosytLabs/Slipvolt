name: Verify verification-doc cleanup once
on:
  push:
    branches: [chore/verification-docs-cleanup-20260923]
    paths: ['.github/workflows/verify-verification-docs-20260923.yml']
permissions:
  contents: read
concurrency:
  group: verify-verification-docs-20260923
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: sh scripts/verify.sh
