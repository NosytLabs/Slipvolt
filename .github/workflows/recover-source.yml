          550b206c5eb87c02e57a51ab68362abbc284b8e6 tests/test_gridraft.py
          48bbefbdd524c7d81f1c73c28e2068a50212479a tests/test_improvements.py
          ca197fb716a12126f29795c5b7b45ccbfe83ec66 tests/test_integrations.py
          196c84e46a32844f2fe1da4e0ec1d4deb0f1cf36 tests/test_launch_readiness.py
          aeec966eab043e9727dc8ac470f1a94358cda9d9 tests/test_member_edges.py
          eceb139560fc1a944312095475224b42b73eeab8 tests/test_membership.py
          b96809f3b50a26b3897f625e5965610ee161d62b tests/test_merge_regressions.py
          2ef3a86191ca49452da5ccd8c6011e458cd12122 tests/test_operator_hardening.py'''
          expected = {line.strip().split(' ',1)[1]: line.strip().split(' ',1)[0] for line in manifest.splitlines()}
          def blob_sha(raw):
              return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          decompressor = lzma.LZMADecompressor()
          pieces=[]
          for sha in parts:
              req=urllib.request.Request('https://api.github.com/repos/NosytLabs/Slipvolt/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response: data=json.load(response)
              raw=base64.b64decode(data['content'])
              assert blob_sha(raw)==sha, 'Uploaded blob integrity mismatch'
              pieces.append(decompressor.decompress(raw,max_length=2_000_000))
          # The previous upload was interrupted. Only complete entries whose hash
          # matches the exact tested source are recovered; nothing is guessed.
          text=b''.join(pieces).decode('utf-8',errors='ignore')
          assert text.startswith('{')
          pos=1; decoder=json.JSONDecoder(); imported=[]; mismatched=[]
          while pos<len(text):
              if text[pos:pos+1]=='}': break
              try:
                  name,end=decoder.raw_decode(text,pos)
                  assert text[end]==':'
                  value,end=decoder.raw_decode(text,end+1)
              except (ValueError,IndexError): break
              pos=end+1
              if name not in expected: continue
              raw=value['content'].encode('utf-8')
              if blob_sha(raw)!=expected[name]:
                  mismatched.append(name); continue
              # CI is installed only with the complete source, later.
              if name.startswith('.github/'): continue
              dest=root/name
              assert dest.resolve().is_relative_to(root)
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(raw)
              dest.chmod(0o755 if value.get('executable') else 0o644)
              imported.append(name)
          report={'imported':imported,'mismatched':mismatched,'missing':[n for n in expected if n not in imported], 'complete_source':False}
          pathlib.Path('RECOVERY_REPORT.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Commit recovery on staging only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'build: recover matching release files from staged source chunks'
          git push origin HEAD:release/oma-compute-audit
