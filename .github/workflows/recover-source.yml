name: Recover verified source
on:
  push:
    branches: [release/oma-compute-audit]
    paths: [.github/workflows/recover-source.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    if: github.repository == 'NosytLabs/Slipvolt' && github.ref == 'refs/heads/release/oma-compute-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover only source files matching the tested release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          root = pathlib.Path.cwd()
          parts = ['c796adbae6b2ff51fba5b335b4fe34e6a8935a91','09369ec11b91e689cc041f8a6175df5b4e679142','d4c7cca8582a561303f0b0599815c91d5bb99dee','4b4f456ed5e8ad6083307062dfb9bb5b1397b432','549d9ed83500b797072f37f77e0825561bc7ea40','46fb425fd92a56c8adb2a4a44a617de7c9ac404b','bbc8c2e689b7353fbdab8e37419cd2cde5cad1f4']
          manifest = '''7ee40000fc7b0f549bc35e05f8c075f4282bcc80 .dockerignore
          1f13842f7bd65fc300cb20cb444ecc414b419db7 .env.example
          a2e919b10653e34dd2ef8eb78ac26fe161676f61 .github/workflows/test.yml
          3ef07b69b2e4f4e21adda53218c4c175988d5036 .gitignore
          c81fd0b1a260ec2fc651a104d4ae71be83716c14 Dockerfile
          1d75e3d133f4e1d715b1e61eed4320f4d3b80c7a README.md
          a505c10e283cc5d345617b3cd8283c36f2dd99bf compose.yaml
          e2f5b98b45981b6687fe6e74fb07b66721fb3b64 docs/ADMIN.md
          3a7fbcedd9c88401c662f5a0e9b599bbd79d3395 docs/API-POLICY.md
          be8a152f85ab76c3b100eca639aef70c1f15d8ec docs/CHANGELOG.md
          3b9ab119470986acb32f32503fb58addfce19b10 docs/DEPLOYMENT.md
          05ed8d966eca36b869c2d1fd817a92869405def0 docs/DESIGN.md
          b6cf047fc43a3f992bb652f2e759d6ddb8d47aac docs/FOUNDER-POLICY.md
          d95963f0ee5980a304fd659b796e17b2d092d368 docs/LAUNCH-AND-UTILITY.md
