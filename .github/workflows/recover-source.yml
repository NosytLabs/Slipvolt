          7b4eb970e44bfbaccf5b6982a895988c2537a018 docs/QUICKNODE.md
          2d7a4a0ab98b8101cf9c740d0a02945d93850382 docs/RESEARCH.md
          898bd9691c33254bc5d647bf5a255e54b27c8c3a docs/SECURITY.md
          2b1167ea5c44d79cb7cc4a5dc71437b9ec8e1636 docs/VERIFICATION.md
          e69de29bb2d1d6434b8b29ae775ad8c2e48c5391 gridraft/__init__.py
