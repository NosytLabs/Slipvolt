          f299f1f047f344898383e800ccf248e0c2a61fd1 operator/README.md
          5a7925c00ee012ae2204aa375f12cd1aeca1b42a operator/calculate.cjs
          fa92aeb456481acc4229cf4df488c786335e87b4 operator/profit-core.js
          4c7c3475223fcd285726d69db2dc925fc8f99b7c operator/profit-planner.html
          f26b0cfb4b53ce05c9c69387b55bcd64071067c9 operator/scenario.json
          ea095199df89ae25a927a60eb2e840be4b3eafc6 public/admin/app.js
          42cfb2eccb70238c18ca154ae9c7058f79bf6cca public/admin/connections.js
          b4447cc7ea1a2e011ae7eccd117edfd36d87c272 public/admin/index.html
          c742f1a01a54c022601f271dda86a74ad859eb97 public/admin/styles.css
          dee28f09bba5afa4873155ea61e0af96315d809e public/app.js
          fde86d4612478e19ffbf5caa33cd49800387a022 public/core.js
          917f0d10bab7123487f7f9e1bcaa13b0fcf5d675 public/favicon.svg
          104ce897ae5cbe4b93cce45976000872f9da64b7 public/index.html
          96de0f4b75207d6574a96455a371e6213c165c80 public/llms.txt
          d35ff49a2379ed5f520e2a1fbee3360b8b42d2aa public/styles.css
          d7c509e53993f341579c8518a5c4e8cda2d3562f requirements-dev.txt
          525c635b683b97da410130b154c371586eda75de requirements.txt
          e4eaed40380574450b2993e0bb7fa3acee298c57 scripts/check_admin_ui.py
          c1d3b41ab25ae01d62afe7a37943cac905094360 scripts/check_connections.py
          a873598dd9daba11eeb655a725f76ce2609e7b8e scripts/check_holder_ui.py
          8b8b86ff7103fadfe452e1a02365f4d91ee8fdb3 scripts/check_openbroker.py
