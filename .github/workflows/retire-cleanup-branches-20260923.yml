name: Retire merged cleanup branches once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-cleanup-branches-20260923.yml']
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: retire-cleanup-branches-20260923
  cancel-in-progress: true
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete only exact merged branch heads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          check_and_delete() {
            branch="$1"
            expected="$2"
            pr="$3"
            current="$(gh api "repos/$repo/git/ref/heads/$branch" --jq .object.sha)"
            test "$current" = "$expected"
            test "$(gh api "repos/$repo/pulls/$pr" --jq .merged)" = "true"
            test "$(gh api "repos/$repo/pulls/$pr" --jq .head.sha)" = "$expected"
            gh api --method DELETE "repos/$repo/git/refs/heads/$branch"
          }
          check_and_delete "chore/repo-cleanup-20260923" "c5532d6f65379fd4ab2a46a021f401aa4e57c8e4" "10"
          check_and_delete "chore/verification-docs-cleanup-20260923" "6b75987e11fa673023e73d92bcca8755e368e9f0" "11"
