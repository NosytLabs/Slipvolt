name: Import complete verified release
on:
  push:
    branches: [release/oma-compute-audit]
    paths: [.github/workflows/import-verified-release.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'NosytLabs/Slipvolt' && github.ref == 'refs/heads/release/oma-compute-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every uploaded byte and every resulting source file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          root=pathlib.Path.cwd()
          parts=['9f7f3e302f63502578e057b36fb95cd31d44edfc','ae0860d84b76f99b4db250e1e59783aceff39818','6cb80123f98e446c12a8e8a3d505f89b446975a0','ebfc33b6c294e0d9c18e593b37d762a9958da6c4','958eef2dc02fe7eb7bfbdb9894554365832b648d','ac046971eef212a115e3857dd3620a7646348d49','19c73c0f294fef0a75534834387515c1dde2d3be','32ab70a79b29950167fa19c81b17d39a54596327','bf56f92ec149890ff1ab3309eb6480ba22fefbcf','c3af2880bab8266b96c90b2a6f22fc5ec87110ba','259a31fe6dfe3b300afc7cc881f2428976cc0805','1be2af3624fca2760e6517d1230cce8600bb9a3f']
          expected=json.loads(pathlib.Path('SOURCE_MANIFEST.json').read_text())
          assert len(expected)==78
          def gitsha(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          chunks=[]
          for part in parts:
              req=urllib.request.Request('https://api.github.com/repos/NosytLabs/Slipvolt/git/blobs/'+part,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response:record=json.load(response)
              raw=base64.b64decode(record['content'])
              assert gitsha(raw)==part, 'Chunk integrity mismatch'
              chunks.append(raw)
          packed=b''.join(chunks)
          assert len(packed)==104892
          assert hashlib.sha256(packed).hexdigest()=='360a476b1bb4c1ab70f2f6fc19cb366252cf0ebefc28d9ca27beb78b66e80d41'
          decoder=lzma.LZMADecompressor()
          payload=decoder.decompress(packed,max_length=2_000_000)
          assert decoder.eof and not decoder.unused_data and len(payload)<2_000_000
          files=json.loads(payload)
          assert len(files)==66
          validated=[]
          for name,entry in files.items():
              path=pathlib.PurePosixPath(name)
              assert name in expected and not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert not name.startswith('.github/') and name!='.env'
              assert isinstance(entry['content'],str) and isinstance(entry['executable'],bool)
              raw=entry['content'].encode('utf-8')
              assert gitsha(raw)==expected[name], 'Source integrity mismatch: '+name
              dest=root/name
              assert not dest.is_symlink() and dest.resolve().is_relative_to(root)
              validated.append((dest,raw,entry['executable']))
          for dest,raw,executable in validated:
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(raw)
              dest.chmod(0o755 if executable else 0o644)
          for name,digest in expected.items():
              assert gitsha((root/name).read_bytes())==digest, 'Final source verification failed: '+name
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          print('Verified all 12 chunks, complete XZ checksum, and all 78 final source files.')
          PY
      - name: Publish verified source on staging branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: publish complete verified Slipvolt account and admin release'
          git push origin HEAD:release/oma-compute-audit
