name: Verify current main once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-current-once-20260923.yml']
permissions:
  contents: read
concurrency:
  group: verify-current-main-once
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: test -x scripts/verify.sh
      - run: python -m pytest -q
      - run: node --test tests/*.test.cjs
      - run: python -m compileall -q gridraft scripts
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_holder_ui.py
      - run: python scripts/check_admin_ui.py
      - run: python scripts/check_content_ui.py
      - run: python scripts/check_status_ui.py
