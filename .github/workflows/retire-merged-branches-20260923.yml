name: Retire merged branches
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-merged-branches-20260923.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete exact merged branch tips
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/chore%2Fci-verifier-cleanup-20260923 --jq .commit.sha)" = "bfbfd8e3919a413fc7d5751f164bc59b6069dbfe"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/9 --jq .merged)" = "true"
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/docs%2Fcurrent-release-cleanup-20260923 --jq .commit.sha)" = "aa7d1d99613c717a9d06fc1e03ab48cfff52c30c"
          test "$(gh api repos/$GITHUB_REPOSITORY/compare/main...docs/current-release-cleanup-20260923 --jq .ahead_by)" = "0"
          gh api --method DELETE repos/$GITHUB_REPOSITORY/git/refs/heads/chore/ci-verifier-cleanup-20260923
          gh api --method DELETE repos/$GITHUB_REPOSITORY/git/refs/heads/docs/current-release-cleanup-20260923
