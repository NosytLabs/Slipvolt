name: Retire merged branches once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-merged-branches-20260923.yml']
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message == 'ops: retire merged Slipvolt branches once'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          ci='chore/ci-verifier-cleanup-20260923'
          ci_sha='bfbfd8e3919a413fc7d5751f164bc59b6069dbfe'
          docs='docs/current-release-cleanup-20260923'
          docs_sha='aa7d1d99613c717a9d06fc1e03ab48cfff52c30c'
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/$ci" --jq .commit.sha)" = "$ci_sha"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/9" --jq .merged)" = "true"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/9" --jq .head.sha)" = "$ci_sha"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/$docs" --jq .commit.sha)" = "$docs_sha"
          test "$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$docs" --jq .ahead_by)" = "0"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ci"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$docs"
