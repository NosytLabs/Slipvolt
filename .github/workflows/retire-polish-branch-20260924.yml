name: Retire merged polish branch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-polish-branch-20260924.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete exact merged branch tip
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/fix%2Fcurrent-main-polish-20260923 --jq .commit.sha)" = "80b1421c29d6ff37dcbc6dd513ca14c47ae52db7"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/12 --jq .merged)" = "true"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/12 --jq .head.sha)" = "80b1421c29d6ff37dcbc6dd513ca14c47ae52db7"
          gh api --method DELETE repos/$GITHUB_REPOSITORY/git/refs/heads/fix/current-main-polish-20260923
